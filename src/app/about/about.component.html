<div class="grid">

  <div class="col-12 md:col-12 xl:col-12">
    <span class="title-page">{{ 'about.title' | translate }}</span>
  </div>

  <div class="col-12 md:col-12 xl:col-12">
    <span class="subtitle-page">{{ 'about.subtitle' | translate }}</span>
  </div>

  <div class="col-12 md-12">
    <p-table [value]="[
      {name: 'PROMISCES Zenodo', link: 'https://zenodo.org/communities/promisces/records?q=&l=list&p=1&s=10&sort=newest'},
      {name: 'NORMAN Database System - API', link: 'https://www.norman-network.com/nds/api/'},
      {name: 'NORMAN Suspect List Exchange – NORMAN SLE', link: 'https://www.norman-network.com/nds/SLE/'},
      {name: 'NORMAN Ecotoxicology Database — Lowest PNECs', link: 'https://www.norman-network.com/nds/ecotox/lowestPnecsIndex.php'},
      {name: 'NORMAN EMPODAT Database - Chemical Occurrence Data', link: 'https://www.norman-network.com/nds/empodat/'},
      {name: 'CompTox Chemicals Dashboard', link: 'https://comptox.epa.gov/dashboard/'},
      {name: 'PFAS Guide - ChemSec', link: 'https://pfas.chemsec.org/'},
      {name: 'PubChem', link: 'https://pubchem.ncbi.nlm.nih.gov/'},
      {name: 'Chemical Exposure Database', link: 'https://www.chemexposure.org/'},
      {name: 'ChemSec Marketplace', link: 'https://marketplace.chemsec.org/'},
      {name: 'Zero PM - Alternative Assessment Database', link: 'https://zeropm.eu/alternative-assessment-database/'},
      {name: 'INERIS substitution portal', link: 'https://substitution-perfluores.ineris.fr/en'},
      {name: 'subsportplus - Substitution Support Portal', link: 'https://www.subsportplus.eu/subsportplus/EN/Home/Home_node.html'},
      {name: 'The Swedish Centre for Chemical Substitution', link: 'https://www.ri.se/en/the-swedish-centre-for-chemical-substitution'},
      {name: 'OECD Series on Risk Management of Chemicals', link: 'https://www.oecd.org/en/publications/oecd-series-on-risk-management-of-chemicals_f7f30439-en.html'}
    ]" [tableStyle]="{'min-width': '50rem'}" styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>{{ 'about.name' | translate }}</th>
          <th>{{ 'about.link' | translate }}</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{item.name}}</td>
          <td><a href="{{item.link}}" target="_blank">{{item.link}}</a></td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
